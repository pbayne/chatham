<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm dark "ink" ground with subtle top-light, matching the Paper theme -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a26"/>
      <stop offset="0.55" stop-color="#1c1c16"/>
      <stop offset="1" stop-color="#121209"/>
    </linearGradient>
    <!-- Cream paper mark with a gentle vertical sheen -->
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset="1" stop-color="#e4dccb"/>
    </linearGradient>
    <!-- Record dot: warm ember red with a touch of depth -->
    <radialGradient id="dot" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d85c49"/>
      <stop offset="0.6" stop-color="#bf4a37"/>
      <stop offset="1" stop-color="#a23b2d"/>
    </radialGradient>
    <!-- Soft inner vignette for depth on the ground -->
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <!-- Subtle drop shadow under the mark for lift -->
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Superellipse (squircle) ground -->
  <path d="M512 72 C 300 72 196 72 134 134 C 72 196 72 300 72 512 C 72 724 72 828 134 890 C 196 952 300 952 512 952 C 724 952 828 952 890 890 C 952 828 952 724 952 512 C 952 300 952 196 890 134 C 828 72 724 72 512 72 Z" fill="url(#ground)"/>
  <path d="M512 72 C 300 72 196 72 134 134 C 72 196 72 300 72 512 C 72 724 72 828 134 890 C 196 952 300 952 512 952 C 724 952 828 952 890 890 C 952 828 952 724 952 512 C 952 300 952 196 890 134 C 828 72 724 72 512 72 Z" fill="url(#vignette)"/>
  <!-- hairline top edge light -->
  <path d="M512 72 C 300 72 196 72 134 134 C 110 158 95 190 86 236 C 150 150 320 120 512 120 C 704 120 874 150 938 236 C 929 190 914 158 890 134 C 828 72 724 72 512 72 Z" fill="#ffffff" opacity="0.05"/>

  <!-- A high-contrast Didone-style serif 'C' that also reads as an open
       speech bubble, opening toward the record dot. Modulated stroke (thin at
       top/bottom, thick at the sides) with gently flared ball terminals. -->
  <g filter="url(#lift)">
    <path fill="url(#mark)" fill-rule="evenodd" d="
      M 742 352
      C 683 290 608 256 520 256
      C 356 256 236 372 236 512
      C 236 652 356 768 520 768
      C 610 768 686 733 745 670
      C 724 648 703 626 682 604
      C 638 652 585 678 520 678
      C 405 678 326 609 326 512
      C 326 415 405 346 520 346
      C 583 346 635 371 679 418
      C 700 396 721 374 742 352
      Z
    "/>
    <!-- upper ball terminal (flared, rounded) -->
    <circle cx="726" cy="368" r="34" fill="url(#mark)"/>
    <!-- lower ball terminal -->
    <circle cx="729" cy="654" r="34" fill="url(#mark)"/>
  </g>

  <!-- Record dot nested in the C's aperture, vertically centered -->
  <circle cx="724" cy="512" r="56" fill="url(#dot)"/>
  <circle cx="724" cy="512" r="56" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="707" cy="495" r="15" fill="#ffffff" opacity="0.22"/>

</svg>
